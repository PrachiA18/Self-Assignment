
<!DOCTYPE html>
<html>
<head>
    <title>Cricket Scoreboard</title>
</head>
<body>

<h2>Cricket Scoreboard</h2>
<div id="output"></div>

<script>
    fetch('scoreboard.json')
        .then(response => response.json())
        .then(data => {
            let output = "";

            
            output += "<h3>Match</h3>";
            output += data.match_details.team1 + " vs " + data.match_details.team2 + "<br>";
            output += "Venue: " + data.match_details.venue + "<br>";

        
            output += "<h3>Players</h3>";
            data.batting_scorecard.forEach(p => {
                output += p.player + " - " + p.runs + " (" + p.balls + ")<br>";
            });

            
            output += "<h3>Total Score</h3>";
            output += data.total_score.runs + "/" + data.total_score.wickets;

            document.getElementById("output").innerHTML = output;
        });
</script>

</body>
</html>
